<!-- ADMIN PAGE VIEW -->
<main id="page-admin" style="display: none;">
  <div class="admin-container">
    <h2>Admin Dashboard: Add New Video</h2>
    
    <!-- Simple Security Pin -->
    <div id="admin-login-box">
      <p>Enter Admin Secret Pin:</p>
      <input type="password" id="admin-pin-input" placeholder="Secret PIN">
      <button class="btn-primary" onclick="checkAdminPin()">Login</button>
    </div>

    <!-- Upload Form (Hidden until PIN is correct) -->
    <form id="admin-form" style="display: none; margin-top: 1.5rem;" onsubmit="uploadVideo(event)">
      <div class="form-group">
        <label>Video Title</label>
        <input type="text" id="video-title-input" placeholder="e.g., The Midnight Protocol" required>
      </div>

      <div class="form-group">
        <label>Google Drive File ID</label>
        <input type="text" id="video-drive-id-input" placeholder="e.g., 1a2b3c4d5e6f..." required>
        <small style="color: var(--text-muted);">Extract the ID from your Google Drive link.</small>
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="video-category-input">
          <option value="Movie">Movie</option>
          <option value="Series">Series</option>
        </select>
      </div>

      <div class="form-group">
        <label>Thumbnail Image URL</label>
        <input type="url" id="video-thumb-input" placeholder="https://image-link.jpg">
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Upload Video to Database</button>
      <p id="admin-status" style="margin-top: 1rem; color: var(--accent-color);"></p>
    </form>
  </div>
</main>
